name: Daily Uyghur Post
on:
  schedule:
    - cron: '10 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/generate-post.js
      - run: |
          git config user.name "uyghur-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/index.json data/posts
          git diff --cached --quiet || git commit -m "chore: daily uyghur post"
          git push
