<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AI بىلەن ئاۋازدىن تېكىست: مەخپىيەتلىك + سۈپەت ئۈچۈن 12 تەكشۈرۈش نۇقتىسى">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020" />
      <stop offset="0.55" stop-color="#102b46" />
      <stop offset="1" stop-color="#1f4d87" />
    </linearGradient>
    <radialGradient id="glow" cx="22%" cy="22%" r="70%">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.35" />
      <stop offset="0.55" stop-color="#34d399" stop-opacity="0.10" />
      <stop offset="1" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35" />
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#94a3b8" opacity="0.25" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.18" />

  <g opacity="0.9">
    <circle cx="1030" cy="135" r="120" fill="#34d399" opacity="0.14" />
    <circle cx="1100" cy="210" r="70" fill="#fbbf24" opacity="0.10" />
    <circle cx="170" cy="520" r="150" fill="#a78bfa" opacity="0.14" />
    <circle cx="270" cy="470" r="80" fill="#60a5fa" opacity="0.12" />
  </g>

  <g filter="url(#softShadow)">
    <rect x="90" y="120" width="1020" height="390" rx="30" fill="#0f172a" opacity="0.78" stroke="#93c5fd" stroke-opacity="0.22" />
  </g>

  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Naskh Arabic,Arial,sans-serif" fill="#e2e8f0">
    <text x="600" y="252" font-size="54" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">
      AI بىلەن ئاۋازدىن تېكىست
    </text>
    <text x="600" y="322" font-size="40" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" fill="#cbd5e1">
      مەخپىيەتلىك + سۈپەت ئۈچۈن 12 تەكشۈرۈش نۇقتىسى
    </text>
    <text x="600" y="402" font-size="26" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" fill="#93c5fd">
      On-device → Cloud → Hybrid • قېلىپلاشتۇرۇش • نورماللاشتۇرۇش
    </text>
  </g>

  <g fill="none" stroke="#34d399" stroke-opacity="0.45">
    <path d="M250 170 C 360 120, 470 120, 560 170" stroke-width="3" />
    <path d="M640 460 C 740 510, 900 510, 1000 460" stroke-width="3" />
  </g>

  <g>
    <rect x="970" y="380" width="130" height="90" rx="18" fill="#0b1225" opacity="0.55" stroke="#34d399" stroke-opacity="0.35" />
    <path d="M1010 420 C 1010 400, 1040 395, 1040 420 C 1040 440, 1010 445, 1010 420 Z" fill="none" stroke="#34d399" stroke-width="3" stroke-opacity="0.7" />
    <rect x="1038" y="410" width="36" height="44" rx="10" fill="none" stroke="#34d399" stroke-width="3" stroke-opacity="0.7" />
    <circle cx="1056" cy="432" r="6" fill="#34d399" opacity="0.85" />
  </g>
</svg>
