<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AI بىلەن ئۇيغۇرچە «سۆزلۈك + RAG» قۇرۇش: ئاتالغۇنى مۇقىم قىلدىغان 7 قەدەم">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08122a" />
      <stop offset="0.55" stop-color="#102a44" />
      <stop offset="1" stop-color="#164e63" />
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="22%" r="70%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.30" />
      <stop offset="0.55" stop-color="#a78bfa" stop-opacity="0.10" />
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35" />
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#94a3b8" stroke-opacity="0.18" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.55" />

  <g opacity="0.92">
    <circle cx="1035" cy="150" r="118" fill="#38bdf8" opacity="0.12" />
    <circle cx="1090" cy="230" r="72" fill="#f59e0b" opacity="0.10" />
    <circle cx="180" cy="515" r="155" fill="#22c55e" opacity="0.11" />
    <circle cx="285" cy="460" r="82" fill="#a78bfa" opacity="0.13" />
  </g>

  <g filter="url(#softShadow)">
    <rect x="90" y="118" width="1020" height="394" rx="30" fill="#0b1220" opacity="0.80" stroke="#a78bfa" stroke-opacity="0.20" />
  </g>

  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Naskh Arabic,Arial,sans-serif" fill="#e2e8f0">
    <text x="600" y="250" font-size="54" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">
      AI بىلەن ئۇيغۇرچە «سۆزلۈك + RAG» قۇرۇش
    </text>
    <text x="600" y="316" font-size="40" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" fill="#cbd5e1">
      ئاتالغۇنى مۇقىم قىلدىغان 7 قەدەم
    </text>
    <text x="600" y="394" font-size="26" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" fill="#a78bfa">
      Glossary → Rules → Retrieval → QA-log → Versioning
    </text>
  </g>

  <g fill="none" stroke="#22c55e" stroke-opacity="0.40">
    <path d="M240 180 C 350 120, 470 120, 580 180" stroke-width="3" />
    <path d="M620 454 C 740 514, 900 514, 1020 454" stroke-width="3" />
  </g>
</svg>
