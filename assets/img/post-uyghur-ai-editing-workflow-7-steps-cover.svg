<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AI بىلەن ئۇيغۇرچە يازما سۈپىتىنى ئاشۇرۇش: 7 قەدەملىك تەھرىر سىستېمىسى">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f2a4a"/>
      <stop offset="1" stop-color="#0b6b6b"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="18%" r="65%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="78%" r="70%">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#e2e8f0" opacity="0.13"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.55"/>

  <g opacity="0.9">
    <path d="M-40,530 C180,390 300,700 520,560 C740,420 880,520 1240,350 L1240,680 L-40,680 Z" fill="#0ea5e9" opacity="0.18"/>
    <path d="M-40,620 C210,430 410,760 650,560 C880,370 1020,520 1240,420 L1240,680 L-40,680 Z" fill="#34d399" opacity="0.14"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="70" y="88" width="1060" height="454" rx="34" fill="rgba(15,23,42,0.42)" stroke="rgba(226,232,240,0.18)"/>
  </g>

  <g>
    <text x="1100" y="235"
      text-anchor="end"
      direction="rtl"
      unicode-bidi="plaintext"
      font-family="Lateef, 'Noto Naskh Arabic', 'Noto Sans Arabic', system-ui, sans-serif"
      font-size="64"
      font-weight="700"
      fill="#ffffff">
      AI بىلەن ئۇيغۇرچە يازما سۈپىتىنى ئاشۇرۇش
    </text>
    <text x="1100" y="315"
      text-anchor="end"
      direction="rtl"
      unicode-bidi="plaintext"
      font-family="Lateef, 'Noto Naskh Arabic', 'Noto Sans Arabic', system-ui, sans-serif"
      font-size="54"
      font-weight="600"
      fill="#e2e8f0"
      opacity="0.98">
      7 قەدەملىك تەھرىر سىستېمىسى
    </text>

    <g transform="translate(96 420)">
      <rect x="0" y="0" width="330" height="54" rx="999" fill="rgba(56,189,248,0.18)" stroke="rgba(147,197,253,0.35)"/>
      <text x="165" y="37" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial"
        font-size="20"
        font-weight="700"
        fill="#e2e8f0"
        letter-spacing="0.7">
        UYGHUR DAILY AI
      </text>
    </g>
  </g>
</svg>
