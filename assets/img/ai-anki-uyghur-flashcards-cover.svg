<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AI + Anki (Uyghur flashcards)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#132A55"/>
      <stop offset="1" stop-color="#1B5AA8"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="20%" r="65%">
      <stop offset="0" stop-color="#8BE9FD" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8BE9FD" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Card stack -->
  <g filter="url(#shadow)" transform="translate(120 140)">
    <rect x="52" y="42" width="520" height="340" rx="26" fill="#0E1A33" opacity="0.55"/>
    <rect x="26" y="20" width="520" height="340" rx="26" fill="#0F2346" opacity="0.75"/>
    <rect x="0" y="0" width="520" height="340" rx="26" fill="#0F2B59"/>
    <rect x="38" y="54" width="444" height="16" rx="8" fill="#8BE9FD" opacity="0.9"/>
    <rect x="38" y="92" width="360" height="12" rx="6" fill="#C7D2FE" opacity="0.9"/>
    <rect x="38" y="118" width="300" height="12" rx="6" fill="#C7D2FE" opacity="0.75"/>
    <rect x="38" y="172" width="200" height="12" rx="6" fill="#C7D2FE" opacity="0.65"/>
    <rect x="38" y="198" width="260" height="12" rx="6" fill="#C7D2FE" opacity="0.65"/>

    <!-- Check + spark -->
    <circle cx="456" cy="256" r="54" fill="#22C55E" opacity="0.92"/>
    <path d="M434 258l16 16 34-44" fill="none" stroke="#06240F" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <g opacity="0.9">
      <path d="M456 170v26" stroke="#8BE9FD" stroke-width="6" stroke-linecap="round"/>
      <path d="M456 316v26" stroke="#8BE9FD" stroke-width="6" stroke-linecap="round"/>
      <path d="M370 256h26" stroke="#8BE9FD" stroke-width="6" stroke-linecap="round"/>
      <path d="M516 256h26" stroke="#8BE9FD" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Title -->
  <g transform="translate(690 170)">
    <text x="0" y="0" fill="#E5E7EB" font-size="56" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-weight="800">
      AI + Anki
    </text>
    <text x="0" y="70" fill="#C7D2FE" font-size="30" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-weight="600">
      Uyghur Flashcards
    </text>
    <text x="0" y="124" fill="#E5E7EB" font-size="34" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-weight="700">
      ئۇيغۇرچە سۆزلۈك كارتىسى
    </text>
    <text x="0" y="170" fill="#A5B4FC" font-size="22" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-weight="500">
      تېز قۇرۇش · تەكشۈرۈش · تەكرارلىتىش
    </text>
  </g>

  <!-- Footer mark -->
  <text x="120" y="592" fill="#93C5FD" font-size="18" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" opacity="0.9">
    Uyghur Daily AI
  </text>
</svg>
