<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Uyghur PDF summarize with AI cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#0f1a3a"/>
      <stop offset="1" stop-color="#062a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .kicker { font: 600 22px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; letter-spacing: 0.12em; }
      .date   { font: 600 16px/1.3 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .title  { font: 700 60px/1.15 "Lateef", "Noto Naskh Arabic", Arial, sans-serif; }
      .sub    { font: 600 34px/1.25 "Lateef", "Noto Naskh Arabic", Arial, sans-serif; opacity: 0.92; }
      .chip   { font: 700 18px/1 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
      .mono   { font: 600 16px/1.3 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow blobs -->
  <circle cx="1040" cy="120" r="150" fill="#38bdf8" opacity="0.14"/>
  <circle cx="210" cy="520" r="210" fill="#34d399" opacity="0.10"/>
  <circle cx="980" cy="520" r="150" fill="#a78bfa" opacity="0.08"/>

  <!-- Main card -->
  <g filter="url(#softShadow)">
    <rect x="70" y="85" width="820" height="460" rx="28" fill="#0b1226" opacity="0.92" stroke="#23315c" stroke-width="1.5"/>
    <rect x="70" y="85" width="820" height="86" rx="28" fill="#0f1a3a" opacity="0.95"/>
    <rect x="70" y="145" width="820" height="26" fill="#0f1a3a" opacity="0.95"/>
    <text x="110" y="138" class="kicker" fill="#bfe8ff">UYGHUR DAILY AI</text>
    <text x="810" y="138" text-anchor="end" class="date" fill="#9ca3af">2026-06-02</text>
  </g>

  <!-- Title (Uyghur RTL text still renders fine in SVG text) -->
  <text x="110" y="265" class="title" fill="#ffffff">AI بىلەن ئۇيغۇرچە PDF</text>
  <text x="110" y="335" class="title" fill="#ffffff">نى خۇلاسە قىلىش</text>
  <text x="110" y="405" class="sub" fill="#dbeafe">پاكىز چىقىرىش → قۇرۇلما → خۇلاسە</text>

  <!-- Chips -->
  <g transform="translate(110 445)">
    <g>
      <rect x="0" y="0" width="98" height="40" rx="14" fill="#0b2642" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="49" y="26" class="chip" fill="#bfdbfe" text-anchor="middle">OCR</text>
    </g>
    <g transform="translate(112 0)">
      <rect x="0" y="0" width="118" height="40" rx="14" fill="#0b2642" stroke="#34d399" stroke-width="1.2"/>
      <text x="59" y="26" class="chip" fill="#bbf7d0" text-anchor="middle">CLEAN</text>
    </g>
    <g transform="translate(244 0)">
      <rect x="0" y="0" width="138" height="40" rx="14" fill="#24113a" stroke="#a78bfa" stroke-width="1.2"/>
      <text x="69" y="26" class="chip" fill="#ddd6fe" text-anchor="middle">SUMMARY</text>
    </g>
    <g transform="translate(396 0)">
      <rect x="0" y="0" width="120" height="40" rx="14" fill="#0b2642" stroke="#fbbf24" stroke-width="1.2"/>
      <text x="60" y="26" class="chip" fill="#fde68a" text-anchor="middle">9 STEPS</text>
    </g>
  </g>

  <!-- Decorative PDF icon -->
  <g transform="translate(930 250)" opacity="0.96">
    <rect x="0" y="0" width="220" height="260" rx="26" fill="#0b1226" opacity="0.78" stroke="#23315c" stroke-width="1.5"/>
    <path d="M55 58h78l32 32v112c0 10-8 18-18 18H55c-10 0-18-8-18-18V76c0-10 8-18 18-18z" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M133 58v34h34" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M60 170h120" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <path d="M60 196h92" stroke="#34d399" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <path d="M60 222h110" stroke="#a78bfa" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
    <text x="110" y="242" class="mono" fill="#c7d2fe" text-anchor="middle">PDF → AI</text>
  </g>
</svg>
