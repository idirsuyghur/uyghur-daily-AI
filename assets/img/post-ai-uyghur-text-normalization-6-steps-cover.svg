<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AI بىلەن ئۇيغۇرچە تېكىستنى نۇرماللاشتۇرۇش: 6 قەدەملىك پاكىزلاش ۋە ئىملا تەكشۈرۈش">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061326" />
      <stop offset="0.55" stop-color="#0b2a3b" />
      <stop offset="1" stop-color="#164e63" />
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="18%" r="70%">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.34" />
      <stop offset="0.55" stop-color="#22c55e" stop-opacity="0.10" />
      <stop offset="1" stop-color="#22c55e" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35" />
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#94a3b8" stroke-opacity="0.18" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.55" />

  <g opacity="0.9">
    <circle cx="1025" cy="140" r="115" fill="#38bdf8" opacity="0.12" />
    <circle cx="1085" cy="215" r="70" fill="#f59e0b" opacity="0.10" />
    <circle cx="175" cy="510" r="150" fill="#a78bfa" opacity="0.13" />
    <circle cx="265" cy="465" r="78" fill="#22c55e" opacity="0.11" />
  </g>

  <g filter="url(#softShadow)">
    <rect x="90" y="118" width="1020" height="394" rx="30" fill="#0b1220" opacity="0.80" stroke="#67e8f9" stroke-opacity="0.20" />
  </g>

  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Naskh Arabic,Arial,sans-serif" fill="#e2e8f0">
    <text x="600" y="255" font-size="54" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">
      AI بىلەن ئۇيغۇرچە تېكىستنى نۇرماللاشتۇرۇش
    </text>
    <text x="600" y="320" font-size="40" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" fill="#cbd5e1">
      6 قەدەملىك پاكىزلاش ۋە ئىملا تەكشۈرۈش
    </text>
    <text x="600" y="395" font-size="26" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" fill="#67e8f9">
      Unicode → بوشلۇق → ئىملا-لوگ → Glossary → SEO-ready
    </text>
  </g>

  <g fill="none" stroke="#22c55e" stroke-opacity="0.42">
    <path d="M250 175 C 350 120, 470 120, 570 175" stroke-width="3" />
    <path d="M630 455 C 740 510, 900 510, 1010 455" stroke-width="3" />
  </g>
</svg>
