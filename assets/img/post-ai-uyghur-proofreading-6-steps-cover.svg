<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Uyghur proofreading with AI cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <circle cx="1020" cy="120" r="140" fill="#38bdf8" opacity="0.18"/>
  <circle cx="180" cy="520" r="190" fill="#22c55e" opacity="0.14"/>
  <circle cx="980" cy="520" r="120" fill="#a78bfa" opacity="0.10"/>

  <rect x="80" y="95" rx="30" ry="30" width="1040" height="440" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)"/>

  <g transform="translate(120,140)">
    <rect x="0" y="0" rx="14" ry="14" width="240" height="56" fill="url(#accent)"/>
    <text x="120" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">AI + ئۇيغۇرچە</text>
  </g>

  <text x="120" y="300" font-family="Lateef, 'Noto Naskh Arabic', Arial, sans-serif" font-size="66" font-weight="700" fill="#ffffff">ئىملا-گرامماتىكا تەكشۈرۈش</text>
  <text x="120" y="372" font-family="Lateef, 'Noto Naskh Arabic', Arial, sans-serif" font-size="54" font-weight="700" fill="#e2e8f0">6 قەدەملىك ئىشلىتىش ئۇسۇلى</text>

  <text x="120" y="438" font-family="Lateef, 'Noto Naskh Arabic', Arial, sans-serif" font-size="34" fill="#cbd5e1">تەكشۈرۈش • بىرخىللىق • ئاخىرقى تەھرىر</text>

  <g transform="translate(900,360)">
    <circle cx="120" cy="120" r="120" fill="rgba(255,255,255,0.06)"/>
    <g filter="url(#soft)" opacity="0.85">
      <path d="M55 125c35-55 75-80 120-90 45 10 85 35 120 90-35 55-75 80-120 90-45-10-85-35-120-90z" fill="#38bdf8" opacity="0.35"/>
    </g>
    <path d="M80 125l35 35 70-90" fill="none" stroke="#22c55e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
