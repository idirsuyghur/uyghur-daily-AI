<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AI بىلەن ئاۋازنى ئۇيغۇرچە تېكىستكە ئايلاندۇرۇش: 8 قەدەملىك مەزمۇن ئىشلەش جەريانى">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020" />
      <stop offset="0.55" stop-color="#102b46" />
      <stop offset="1" stop-color="#1f4d87" />
    </linearGradient>
    <radialGradient id="glow" cx="24%" cy="20%" r="65%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.46" />
      <stop offset="0.55" stop-color="#38bdf8" stop-opacity="0.10" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35" />
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#94a3b8" opacity="0.25" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.18" />

  <g opacity="0.9">
    <circle cx="1020" cy="130" r="120" fill="#22c55e" opacity="0.13" />
    <circle cx="1090" cy="205" r="70" fill="#f59e0b" opacity="0.10" />
    <circle cx="150" cy="520" r="150" fill="#a78bfa" opacity="0.14" />
    <circle cx="250" cy="470" r="80" fill="#38bdf8" opacity="0.12" />
  </g>

  <g filter="url(#softShadow)">
    <rect x="90" y="120" width="1020" height="390" rx="30" fill="#0f172a" opacity="0.78" stroke="#93c5fd" stroke-opacity="0.22" />
  </g>

  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Naskh Arabic,Arial,sans-serif" fill="#e2e8f0">
    <text x="600" y="265" font-size="54" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">
      AI بىلەن ئاۋازنى ئۇيغۇرچە تېكىستكە ئايلاندۇرۇش
    </text>
    <text x="600" y="330" font-size="40" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" fill="#cbd5e1">
      8 قەدەملىك مەزمۇن ئىشلەش جەريانى
    </text>
    <text x="600" y="402" font-size="26" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" fill="#93c5fd">
      Transcribe → ئىملا → قۇرۇلمىلاش → ماقالە → قايتا ئىشلىتىش
    </text>
  </g>

  <g fill="none" stroke="#38bdf8" stroke-opacity="0.45">
    <path d="M250 170 C 340 120, 470 120, 560 170" stroke-width="3" />
    <path d="M640 460 C 740 510, 900 510, 1000 460" stroke-width="3" />
  </g>
</svg>
