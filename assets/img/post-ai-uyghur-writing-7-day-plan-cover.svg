<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AI بىلەن ئۇيغۇرچە يازما قابىلىيىتىنى ئاشۇرۇش: 7 كۈنلۈك مەشقى پىلانى">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020" />
      <stop offset="0.55" stop-color="#0a2a3f" />
      <stop offset="1" stop-color="#1d4ed8" />
    </linearGradient>
    <radialGradient id="glow" cx="24%" cy="18%" r="72%">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.34" />
      <stop offset="0.55" stop-color="#22c55e" stop-opacity="0.10" />
      <stop offset="1" stop-color="#22c55e" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35" />
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#94a3b8" stroke-opacity="0.18" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.55" />

  <g opacity="0.9">
    <circle cx="1040" cy="150" r="120" fill="#38bdf8" opacity="0.12" />
    <circle cx="1095" cy="225" r="72" fill="#f59e0b" opacity="0.10" />
    <circle cx="190" cy="505" r="155" fill="#a78bfa" opacity="0.13" />
    <circle cx="285" cy="460" r="82" fill="#22c55e" opacity="0.11" />
  </g>

  <g filter="url(#softShadow)">
    <rect x="90" y="118" width="1020" height="394" rx="30" fill="#0b1220" opacity="0.80" stroke="#67e8f9" stroke-opacity="0.20" />
  </g>

  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Naskh Arabic,Arial,sans-serif" fill="#e2e8f0">
    <text x="600" y="248" font-size="54" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">
      AI بىلەن ئۇيغۇرچە يازما قابىلىيىتىنى ئاشۇرۇش
    </text>
    <text x="600" y="318" font-size="40" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" fill="#cbd5e1">
      7 كۈنلۈك مەشقى پىلانى (Prompt + تەھرىر)
    </text>
    <text x="600" y="395" font-size="26" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" fill="#67e8f9">
      قۇرۇلما → كىرىش → مىسال → تەھرىر → Checklist → SEO → ئاۋاز
    </text>
  </g>

  <g fill="none" stroke="#22c55e" stroke-opacity="0.42">
    <path d="M245 178 C 350 120, 470 120, 575 178" stroke-width="3" />
    <path d="M625 455 C 740 512, 900 512, 1015 455" stroke-width="3" />
  </g>
</svg>
